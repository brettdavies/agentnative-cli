# Throwaway wall-clock benchmark for the KD2 decision; lives only on bench/** branches.
name: bench-kd2

on:
  push:
    branches: ['bench/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-kd2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SITE_SHA: 031ec6ea6d1928208808c7afed64bf62fc9049be
      ROUNDS: "5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build anc (web)
        run: cargo build --release --features web && ls -la target/release/anc
      - name: Build anc (web) with a larger idle connection pool
        run: |
          rsync -a --exclude target ./ "$RUNNER_TEMP/pool/" && cd "$RUNNER_TEMP/pool"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('src/web_audit/transport.rs'); s = p.read_text()
          old = '        .max_redirects_will_error(false)\n'
          assert old in s
          p.write_text(s.replace(old, old + '        .max_idle_connections(64)\n        .max_idle_connections_per_host(16)\n', 1))
          PY
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-pool" cargo build --release --features web
          ls -la "$GITHUB_WORKSPACE/target-pool/release/anc"
      - name: Build embedded-engine prototype
        if: hashFiles('bench/js-embed/Cargo.toml') != ''
        run: cargo build --release --manifest-path bench/js-embed/Cargo.toml && ls -la bench/js-embed/target/release/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Site engine at the pinned commit
        run: |
          git init -q site && cd site
          git fetch -q --depth 1 https://github.com/brettdavies/agentnative-site.git "$SITE_SHA"
          git checkout -q FETCH_HEAD
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 bun install --frozen-lockfile
          bun run build > /dev/null
      - name: Benchmark
        run: bash bench/run.sh
      - name: Request traces
        run: bash bench/trace.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-kd2
          path: bench/out/
