# Throwaway wall-clock benchmark of the web transport changes; lives only on bench/** branches.
name: bench-transport

on:
  push:
    branches: ['bench/transport-**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SITE_SHA: 031ec6ea6d1928208808c7afed64bf62fc9049be
      ROUNDS: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install tracing tools
        run: sudo apt-get install -y --no-install-recommends strace time
      - name: Build variants
        run: bash bench/build.sh
      - name: Local audits and handshakes
        run: bash bench/local.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-transport
          path: |
            bench/out/local.tsv
            bench/out/local-summary.md
            bench/out/handshake.tsv
            bench/out/sizes.tsv
