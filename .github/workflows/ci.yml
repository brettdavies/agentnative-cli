# Source repo CI wrapper — calls the centralized reusable workflow.
# Copy to .github/workflows/ci.yml in the tool repo.
#
# The reusable workflow runs: fmt, clippy, test, cargo-deny check, package check,
# Windows dep check, and changelog verification (on PRs to main).
# No secrets required — only needs contents: read and pull-requests: read.
#
# pull_request only: merges to main/dev are squash merges, so a push run
# would re-verify the identical tree already checked at the PR head.
#
# No concurrency block here: the reusable declares its own
# `${{ github.workflow }}-${{ github.ref }}` group, which evaluates in this
# caller's context. Declaring the same group here makes the caller and the
# called workflow contend for one group, and GitHub cancels the run as a
# deadlock before any job starts.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# Crate downloads on hosted runners, Linux and Windows alike, fail with curl
# error 16 ("Error in the HTTP2 framing layer"), which cargo does not retry;
# HTTP/1.1 avoids it. The reusable workflow sets the same for its own jobs.
env:
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  ci:
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job. The rulesets already block the merge; this is so the run's
      # colour matches what a human scanning the Actions tab should act on.
      advisories_blocking: true
      # completions/ ships with the crate and is generated from the clap
      # definition; the job fails when a help string changes without a
      # regeneration.
      completions: true
      # Cargo.toml declares rust-version; this compiles every feature on it.
      msrv: true
      # docs.rs builds the published docs with every feature; this fails a
      # broken intra-doc link at the PR instead of after publish.
      docs: true
