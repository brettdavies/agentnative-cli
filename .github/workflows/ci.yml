# Canonical version: 2026.11.03 (rust)
#
# Source repo CI wrapper: calls the centralized reusable workflows.
# Copy to .github/workflows/ci.yml in the tool repo.
#
# rust-change-scope.yml decides whether the change can reach cargo at all, by
# the repo's scripts/cargo-inputs.sh (copy it verbatim from rust-tool-release).
# Without that script the scope job fails, and every Rust job runs.
# rust-ci.yml runs fmt, clippy, test, cargo-deny check, package check, Windows
# check, and changelog verification (on PRs to main), plus each job an input
# below turns on.
# lint-basics.yml runs actionlint and markdownlint.
# No secrets required: only contents: read and pull-requests: read, and
# actions: write on the prune-caches job, which deletes caches.
#
# Checks run on pull requests: merges to main and dev are squash merges, so the
# merge commit's tree equals the PR head these jobs already verified. The
# compensating local gate is the hook pair at scripts/hooks/, which mirrors
# these jobs before the push leaves the machine.
#
# A push to dev, or a manual dispatch, is a warm run; finalize-release.yml
# dispatches one on main once a release is marked latest, so the release merge
# starts no run beside the release's own. A pull request restores caches from
# its own ref, its base branch, and the default branch, and only a run outside
# a pull request can write those two branches' scopes, so without warm runs
# every new pull request builds its dependencies cold. A warm run builds what
# each check compiles without running the check, then deletes the ref's
# superseded caches. Pull requests' caches are pr-cache-cleanup.yml's.
#
# Swatinem/rust-cache keys each cache on the job id, the `key` input, and every
# CARGO*, RUST*, CC*, CFLAGS*, CXX*, and CMAKE* variable in the job's
# environment. A warm run matches a pull request's keys only while those stay
# the same in both modes, so what differs between the modes lives in step
# conditions and commands.
#
# `cache-on-failure` applies to pull request runs alone. A warm run that fails
# partway would leave a partial entry under the exact key, and rust-cache skips
# saving after an exact-key restore, so no later run would refill it.
name: CI

on:
  pull_request:
  push:
    branches: [dev, feat/ci-warm-caches]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# The group key leads with a literal token naming this workflow. A key built
# only from context (`${{ github.workflow }}`) is one the reusables called below
# also produce, because `github.workflow` resolves to this caller's name inside
# a called workflow; both then land in one group and a reusable's queue cancels
# this run. The reusables carry their own `rust-ci-` and `lint-basics-` tokens.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Crate downloads on hosted runners, Linux and Windows alike, fail with curl
# error 16 ("Error in the HTTP2 framing layer"), which cargo does not retry;
# HTTP/1.1 avoids it. The reusable workflow sets the same for its own jobs.
env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_INCREMENTAL: 0
  # Half the target directory of full debug info and as fast to build as none,
  # and a failing test's backtrace keeps its file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always
  # Differs between the modes, so its name stays outside rust-cache's prefixes.
  TEST_NO_RUN: ${{ github.event_name != 'pull_request' && '--no-run' || '' }}

jobs:
  # Whether the change can reach cargo, by scripts/cargo-inputs.sh. A
  # documentation-only PR skips every Rust job, and a skipped job reports
  # success, so required checks still pass. The `ci` job runs unless this
  # answered `false`, so a scope job that fails runs the full battery.
  scope:
    if: github.event_name == 'pull_request'
    uses: brettdavies/.github/.github/workflows/rust-change-scope.yml@main

  ci:
    needs: scope
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    # Every rust-ci input, one line each. The reusable's
    # on.workflow_call.inputs holds each one's full description and default.
    #   advisories_blocking         an advisory fails the run (set below)
    #   windows_nasm                install NASM on the Windows jobs, for a dependency that assembles there
    #   docs_only                   skip every job (set below, from the scope job)
    #   cross_os_tests              run cargo test on Windows and macOS too
    #   docs                        cargo doc with warnings denied (set below)
    #   msrv                        cargo check on the root Cargo.toml's rust-version (set below), which
    #                               equals rust-toolchain.toml's channel, so it builds on the pinned toolchain
    #   completions                 scripts/generate-completions.sh --check (rust-tool-release)
    #   lint_stdio                  scripts/lint-stdio.sh (rust-tool-release skeleton)
    #   workflow_concurrency        scripts/check-workflow-concurrency.sh (github-repo-setup)
    #   anc_version, anc_bin        the agent-native audit at an exact anc release, on the named binary
    #   anc_score_floor             the lowest badge score that audit accepts
    #   anc_blocking_tiers          which failing audit rows block: `must` or `any`
    #   release_size_ceiling_bytes  with anc_version set, the largest release binary allowed
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job, so the run's colour matches what a human scanning the
      # Actions tab should act on.
      advisories_blocking: true
      docs_only: ${{ needs.scope.outputs.rust == 'false' }}
      docs: true
      msrv: true
      # completions/ ships with the crate and is generated from the clap
      # definition; the job fails when a help string changes without a
      # regeneration.
      completions: true

  # A job of its own so its checks report as `warm / <job>`, never under a
  # required `ci / <job>` name. rust-cache keys on the reusable's job ids, not
  # this caller's, so these are the caches the `ci` call restores. It turns on
  # the same optional jobs as the `ci` call, so each of those has a cache to
  # restore.
  warm:
    if: github.event_name != 'pull_request'
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    with:
      warm_cache: true
      docs: true
      msrv: true
      completions: true

  # The reusable workflow above builds the default feature set. The local web
  # audit is the `web` feature, off by default, so these jobs hold that build
  # to the same clippy, test and Windows bars. They do not wait on the scope
  # job: they run on every pull request whatever the classifier decides, so the
  # required "Web feature (clippy, test)" check never rests on its verdict. A
  # warm run builds what each step compiles: `cargo check` fills the
  # dependencies clippy reuses, and the tests build with `--no-run`.
  web:
    name: Web feature (clippy, test)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs what rust-toolchain.toml names, components included, so the
      # version lives in one file and no action pin has to track it.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}

      - name: Clippy
        run: cargo ${{ github.event_name == 'pull_request' && 'clippy' || 'check' }} --all-targets --features web

      - name: Tests
        run: cargo test --features web ${{ env.TEST_NO_RUN }}

  web-windows:
    name: Web feature (Windows check)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: ${{ github.event_name == 'pull_request' }}

      # aws-lc-sys (behind rustls's aws-lc-rs provider) assembles with NASM on
      # x86-64 Windows, and the hosted Windows image does not ship it.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'

      - name: Check (Windows)
        run: cargo check --all-targets --features web

  # The web audit's TLS stack, HTTP client and regex engine are the one cost
  # a Rust-native port can silently lose, so the release artifact is measured
  # rather than assumed. The ceiling lives in the script. The build enables the
  # `web` feature: that is the binary a release ships once the feature is on
  # by default. A warm run builds the binary and installs jaq, and checks
  # neither.
  size:
    name: Release binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --release --features web

      - name: Check size against the ceiling
        if: github.event_name == 'pull_request'
        run: scripts/check-binary-size.sh

      # The product promise is a website audit in one or two minutes with no
      # runtime to install. The install half is a single download the release
      # workflow publishes; this measures the other half, which is the half
      # that can regress silently.
      - name: Install jaq
        run: cargo install jaq --locked

      - name: First-run smoke check
        if: github.event_name == 'pull_request'
        run: scripts/smoke-web-audit.sh

  # A warm run saves each job's cache under a key that ends in the hash of the
  # manifests, the lockfile, and the toolchain files, so every change to one of
  # those leaves the ref holding the caches of the one before. GitHub evicts
  # the least recently used entries once a repository passes 10 GB, and those
  # superseded entries outlast the ones pull requests read. After a warm run
  # that every job finished, this keeps one cache of each key and deletes the
  # rest: the one the run saved, else the one it restored, which is the most
  # recently used. A saved cache outranks a later read because a pull request
  # whose merge commit predates the ref's last push can restore the previous
  # generation after this run saved the current one. A toolchain change also
  # moves the key's environment hash, so the previous toolchain's caches fall
  # outside these groups and leave by eviction. A re-run builds its original
  # commit, so once the ref has moved on, the caches it used are an older
  # generation's, and it deletes nothing.
  prune-caches:
    name: Prune superseded caches
    needs: [warm, web, web-windows, size]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete this ref's superseded rust-cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/${GH_REPO}/git/ref/${REF#refs/}" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "${REF} has moved on from ${GITHUB_SHA} to ${head}; nothing pruned"
            exit 0
          fi
          started=$(gh api "repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)
          gh cache list --ref "$REF" --limit 1000 --json id,key,createdAt,lastAccessedAt,sizeInBytes \
            | jq -r --arg started "$started" '[.[] | select(.key | startswith("v0-rust-"))]
                | group_by(.key | sub("-[^-]+$"; ""))
                | .[] | sort_by([.createdAt >= $started, .lastAccessedAt]) | .[:-1][]
                | "\(.id)\t\(.sizeInBytes)\t\(.key)"' > stale.tsv
          freed=0
          while IFS=$'\t' read -r id size key; do
            gh cache delete "$id"
            echo "deleted ${key}"
            freed=$((freed + size))
          done < stale.tsv
          echo "Deleted $(wc -l < stale.tsv) superseded caches on ${REF}, $((freed / 1048576)) MB"
