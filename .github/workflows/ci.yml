# Canonical version: 2026.11.03 (rust)
#
# Source repo CI wrapper: calls the centralized reusable workflows.
# Copy to .github/workflows/ci.yml in the tool repo.
#
# rust-change-scope.yml decides whether the change can reach cargo at all, by
# the repo's scripts/cargo-inputs.sh (copy it verbatim from rust-tool-release).
# Without that script the scope job fails, and every Rust job runs.
# rust-ci.yml runs fmt, clippy, test, cargo-deny check, package check, Windows
# check, and changelog verification (on PRs to main), plus each job an input
# below turns on.
# lint-basics.yml runs actionlint and markdownlint.
# No secrets required: only contents: read and pull-requests: read.
#
# pull_request only: merges to main and dev are squash merges, so the merge
# commit's tree equals the PR head this workflow already verified, and a push
# run would re-check an identical tree for no new signal. The compensating
# local gate is the hook pair at scripts/hooks/, which mirrors these jobs
# before the push leaves the machine.
name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# The group key leads with a literal token naming this workflow. A key built
# only from context (`${{ github.workflow }}`) is one the reusables called below
# also produce, because `github.workflow` resolves to this caller's name inside
# a called workflow; both then land in one group and a reusable's queue cancels
# this run. The reusables carry their own `rust-ci-` and `lint-basics-` tokens.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Crate downloads on hosted runners, Linux and Windows alike, fail with curl
# error 16 ("Error in the HTTP2 framing layer"), which cargo does not retry;
# HTTP/1.1 avoids it. The reusable workflow sets the same for its own jobs.
env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_INCREMENTAL: 0
  # Half the target directory of full debug info and as fast to build as none,
  # and a failing test's backtrace keeps its file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  # Whether the change can reach cargo, by scripts/cargo-inputs.sh. A
  # documentation-only PR skips every Rust job, and a skipped job reports
  # success, so required checks still pass. The `ci` job runs unless this
  # answered `false`, so a scope job that fails runs the full battery.
  scope:
    uses: brettdavies/.github/.github/workflows/rust-change-scope.yml@main

  ci:
    needs: scope
    if: ${{ !cancelled() }}
    uses: brettdavies/.github/.github/workflows/rust-ci.yml@main
    # Every rust-ci input, one line each. The reusable's
    # on.workflow_call.inputs holds each one's full description and default.
    #   advisories_blocking         an advisory fails the run (set below)
    #   windows_nasm                install NASM on the Windows jobs, for a dependency that assembles there
    #   docs_only                   skip every job (set below, from the scope job)
    #   cross_os_tests              run cargo test on Windows and macOS too
    #   docs                        cargo doc with warnings denied (set below)
    #   msrv                        cargo check on the root Cargo.toml's rust-version (set below), which
    #                               equals rust-toolchain.toml's channel, so it builds on the pinned toolchain
    #   completions                 scripts/generate-completions.sh --check (rust-tool-release)
    #   lint_stdio                  scripts/lint-stdio.sh (rust-tool-release skeleton)
    #   workflow_concurrency        scripts/check-workflow-concurrency.sh (github-repo-setup)
    #   anc_version, anc_bin        the agent-native audit at an exact anc release, on the named binary
    #   anc_score_floor             the lowest badge score that audit accepts
    #   anc_blocking_tiers          which failing audit rows block: `must` or `any`
    #   release_size_ceiling_bytes  with anc_version set, the largest release binary allowed
    with:
      # An advisory turns this run red rather than leaving it green with one
      # failed job, so the run's colour matches what a human scanning the
      # Actions tab should act on.
      advisories_blocking: true
      docs_only: ${{ needs.scope.outputs.rust == 'false' }}
      docs: true
      msrv: true
      # completions/ ships with the crate and is generated from the clap
      # definition; the job fails when a help string changes without a
      # regeneration.
      completions: true

  # The reusable workflow above builds the default feature set. The local web
  # audit is the `web` feature, off by default, so these jobs hold that build
  # to the same clippy, test and Windows bars. They do not wait on the scope
  # job: they run on every pull request whatever the classifier decides, so the
  # required "Web feature (clippy, test)" check never rests on its verdict.
  web:
    name: Web feature (clippy, test)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs what rust-toolchain.toml names, components included, so the
      # version lives in one file and no action pin has to track it.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --all-targets --features web

      - name: Tests
        run: cargo test --features web

  web-windows:
    name: Web feature (Windows check)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-Dwarnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      # aws-lc-sys (behind rustls's aws-lc-rs provider) assembles with NASM on
      # x86-64 Windows, and the hosted Windows image does not ship it.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress --yes
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'

      - name: Check (Windows)
        run: cargo check --all-targets --features web

  # The web audit's TLS stack, HTTP client and regex engine are the one cost
  # a Rust-native port can silently lose, so the release artifact is measured
  # rather than assumed. The ceiling lives in the script. The build enables the
  # `web` feature: that is the binary a release ships once the feature is on
  # by default.
  size:
    name: Release binary size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --release --features web

      - name: Check size against the ceiling
        run: scripts/check-binary-size.sh

      # The product promise is a website audit in one or two minutes with no
      # runtime to install. The install half is a single download the release
      # workflow publishes; this measures the other half, which is the half
      # that can regress silently.
      - name: Install jaq
        run: cargo install jaq --locked

      - name: First-run smoke check
        run: scripts/smoke-web-audit.sh

      # The test profile always unwinds, so only a release-profile build can
      # show that a handler panic costs that one row and not the run. The
      # dependencies are the ones the release build above just compiled.
      - name: Build release with a handler that panics on request
        run: cargo build --release --features web,handler-panic-probe

      - name: A handler panic in a release build still ends in a scorecard
        run: scripts/smoke-web-audit.sh target/release/anc --panic-probe
