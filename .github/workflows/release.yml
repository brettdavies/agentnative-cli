# Source repo release wrapper — calls the centralized reusable workflow.
#
# crate: agentnative (crates.io name) | bin: anc (installed executable)
#
# Pipeline: check-version -> build (7 targets) -> attest (build provenance, and a
# CycloneDX SBOM of the binary) -> crates.io -> release (non-draft) -> verify the
# published files against their attestations -> homebrew bottle build -> bottles
# upload back to release assets -> finalize-release marks the release final.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  # The reusable workflow's attest job takes this from the caller.
  attestations: write

jobs:
  pipeline:
    uses: brettdavies/.github/.github/workflows/rust-release.yml@main
    with:
      crate: agentnative
      bin: anc
      # Block release on linux-musl build failure (anc has been spike-validated
      # against both x86_64- and aarch64-unknown-linux-musl).
      linux_musl_required: true
      # Belt-and-suspenders: exec the x86_64-musl binary inside alpine:latest
      # after build to catch dlopen/NSS/locale surprises that pass the
      # static-link `file` assertion.
      linux_musl_verify_alpine: true
      # The Homebrew formula installs the darwin and musl archives, and the tap
      # verifies each against its attestation before it pins the checksum, so
      # a release without attestations never reaches Homebrew.
      attest: true
    secrets:
      CI_RELEASE_TOKEN: ${{ secrets.CI_RELEASE_TOKEN }}
