# Drift gate for src/skill_install/skill.json against the canonical site
# contract at agentnative-site/src/data/skill/skill.json. build.rs reads
# the committed fixture and emits the SkillHost enum, KNOWN_HOSTS const,
# and resolve_host fn into $OUT_DIR/generated_hosts.rs at compile time.
#
# Failure means the site has updated src/data/skill/skill.json without a
# corresponding fixture refresh. Run `scripts/sync-skill-fixture.sh`
# locally, review the diff, commit, push.

name: skill-fixture-drift

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run drift check
        run: bash scripts/sync-skill-fixture.sh --check
