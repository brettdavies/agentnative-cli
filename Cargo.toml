[package]
name = "agentnative"
version = "0.7.0"
edition = "2024"
description = "The agent-native CLI linter — audit whether your CLI follows agent-readiness principles"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brettdavies/agentnative-cli"
homepage = "https://anc.dev"
documentation = "https://docs.rs/agentnative"
keywords = ["cli", "linter", "agent", "ast-grep", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Brett Davies <pm8fp22mbg@privaterelay.appleid.com>"]
readme = "README.md"
rust-version = "1.89"
exclude = [
    ".claude/",
    ".context/",
    ".github/",
    ".markdownlint-cli2.yaml",
    "cliff.toml",
    "deny.toml",
    "docs/",
    "rustfmt.toml",
    "scripts/",
    "src/runner/help_probe/snapshots/",
    "tests/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "anc"
path = "src/main.rs"

[dependencies]
# AST pattern matching — pinned pre-1.0
ast-grep-core = { version = "=0.42.3" }
ast-grep-language = { version = "=0.42.3", default-features = false, features = [
    "tree-sitter-rust",
    "tree-sitter-python",
] }

# CLI framework
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4"

# ANSI styling for status prefixes — already transitive via clap.
# Declared as direct deps so anc owns the version pin for color output.
anstyle = "1"
anstream = "1"

# Manifest parsing
toml = "0.8"

# Workspace discovery: member-glob expansion and the gitignore-aware tree
# scan. Both already compile in through `ast-grep-language`; the
# requirements match its lockfile versions so the binary gains no code.
globset = "0.4.18"
ignore = "0.4.25"

# Serialization. `preserve_order` keeps JSON object keys in insertion order,
# so an envelope prints its keys in the order the code builds them.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Platform
libc = "0.2"

# RFC 3339 timestamps for scorecard `run.started_at`. Pinned exact (pre-1.0
# convention). `formatting` feature enables `OffsetDateTime::format` with the
# `Rfc3339` well-known description; default `std` feature is required for
# `OffsetDateTime::now_utc`.
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting"] }

[features]
default = []

[build-dependencies]
# YAML for the vendored spec frontmatter (build.rs → $OUT_DIR/generated_requirements.rs),
# loaded as serde_json values. Deserialize only; build_support/yaml.rs sets the
# parser options.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }

[dev-dependencies]
# Derives the scorecard shape in src/scorecard/schema_drift.rs, the test that holds the
# hand-written schema/scorecard.schema.json to the serialized types. Test-only.
schemars = "1.2.3"
assert_cmd = "2"
insta = "1"
predicates = "3"
# Used by the tests that include the build_support modules.
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
# Tempdir / tempfile fixtures for skill_install destination-check tests.
# Already a transitive dev-dep via insta — declared here so it's a direct
# dependency we control.
tempfile = "3"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/agentnative-{ target }.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/agentnative-{ target }.zip"
pkg-fmt = "zip"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
