[package]
name = "agentnative"
version = "0.5.0"
edition = "2024"
description = "The agent-native CLI linter — audit whether your CLI follows agent-readiness principles"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brettdavies/agentnative-cli"
homepage = "https://anc.dev"
documentation = "https://docs.rs/agentnative"
keywords = ["cli", "linter", "agent", "ast-grep", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Brett Davies <pm8fp22mbg@privaterelay.appleid.com>"]
readme = "README.md"
rust-version = "1.88"
exclude = [
    ".claude/",
    ".context/",
    ".github/",
    ".markdownlint-cli2.yaml",
    "cliff.toml",
    "deny.toml",
    "docs/",
    "rustfmt.toml",
    "scripts/",
    "tests/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "anc"
path = "src/main.rs"

[dependencies]
# AST pattern matching — pinned pre-1.0
ast-grep-core = { version = "=0.42.0" }
ast-grep-language = { version = "=0.42.0", default-features = false, features = [
    "tree-sitter-rust",
    "tree-sitter-python",
] }

# CLI framework
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4"

# ANSI styling for status prefixes — already transitive via clap.
# Declared as direct deps so anc owns the version pin for color output.
anstyle = "1"
anstream = "1"

# Manifest parsing
toml = "0.8"

# Serialization. `preserve_order` keeps JSON object keys in insertion order:
# the web scorecard's evidence objects are open maps whose key order is part
# of the byte-for-byte parity contract with the anc.dev engine.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Platform
libc = "0.2"

# RFC 3339 timestamps for scorecard `run.started_at`. Pinned exact (pre-1.0
# convention). `formatting` feature enables `OffsetDateTime::format` with the
# `Rfc3339` well-known description; default `std` feature is required for
# `OffsetDateTime::now_utc`.
time = { version = "=0.3.47", default-features = false, features = ["std", "formatting"] }

# Web-audit networking stack: blocking ureq over rustls with the aws-lc-rs
# crypto provider and the bundled Mozilla roots (webpki-roots), so a run needs
# no system trust store. Redirects stay off at the agent; the fetch layer
# follows them itself so every hop is locality-classified before connecting.
ureq = { version = "=3.4.2", default-features = false, features = [
    "rustls-no-provider",
    "rustls-webpki-roots",
    "gzip",
    "brotli",
] }
# Direct dependency at the exact version ureq resolves: the fetch layer
# matches rustls's certificate-error variants inside ureq's error to tell a
# bundled-root rejection from other TLS failures, and ureq does not treat
# the wrapped error as API.
rustls = { version = "=0.23.45", default-features = false, features = [
    "aws-lc-rs",
    "std",
    "tls12",
    "logging",
] }
# WHATWG URL parsing, so evidence URLs and redirect targets resolve exactly
# as the site engine's `new URL()` does.
url = "2"
# Linear-time regex engine for the registry's assertion patterns.
regex = "1"

[build-dependencies]
# Vendored spec frontmatter parser (build.rs → $OUT_DIR/generated_requirements.rs).
# serde_yaml is deprecated upstream but still functional; pinned tightly.
# Re-evaluate (saphyr / yaml-rust2) if cargo-deny flags it.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "=0.9.34"
# Compiles every vendored web-audit registry pattern at build time
# (build_support/web_registry.rs) so a pattern the runtime engine cannot
# run fails the build naming its check id.
regex = "1"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
# Used by tests/build_parser.rs to exercise the build_support/parser.rs module.
serde_yaml = "=0.9.34"
# Used by tests/build_registry.rs to exercise build_support/web_registry.rs.
regex = "1"
# Tempdir / tempfile fixtures for skill_install destination-check tests.
# Already a transitive dev-dep via insta — declared here so it's a direct
# dependency we control.
tempfile = "3"
# Gzip fixtures for the bounded-body tests (a compressed body that inflates
# past the cap must stop at the cap).
flate2 = "1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/agentnative-{ target }.tar.gz"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/agentnative-{ target }.zip"
pkg-fmt = "zip"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
