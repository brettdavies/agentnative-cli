[package]
name = "hs"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12", "logging"] }
webpki-roots = "1.0.11"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
